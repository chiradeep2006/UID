<!DOCTYPE html>
<html>
<head>
    <title>Academic Data Table</title>
    <style>
   
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }
    
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 12px;
        }
   
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>
        <caption>Semester Course Overview</caption>
        <thead>
            <tr>
                <th>Course Code</th>
                <th>Subject Name</th>
                <th>Credits</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>23MAT116</td>
                <td>Discrete Mathematics</td>
                <td>4</td>
            </tr>
            <tr>
                <td>23CSE101</td>
                <td>Java Programming</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
