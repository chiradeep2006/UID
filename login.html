<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Chira's Watches</title>
    <meta name="description" content="Login or Sign Up to access your Chira's Watches collection cart and account settings.">
    <link rel="stylesheet" href="style.css">
    <style>

        .navbar .nav-links a { color: var(--text-secondary); }
    </style>
</head>
<body>

        <nav class="navbar">
        <div class="container flex items-center justify-between">
            
            <div class="nav-left">
                <a href="login.html" class="btn">Logout</a>
                <a href="index.html" class="brand-logo">CHIRA'S</a>
            </div>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="login.html" class="active">Sign In</a></li>
            </ul>
        </div>
    </nav>


    <section class="auth-container">
        
        <div class="auth-wrapper">
           
            <input type="radio" id="tab-login" name="auth-tab" class="form-toggle-input" checked>
            <input type="radio" id="tab-signup" name="auth-tab" class="form-toggle-input">

            <div class="form-labels">
                <label for="tab-login">Sign In</label>
                <label for="tab-signup">Register</label>
            </div>

            <div class="forms-box">
                
                <form id="login-form" class="form-content" onsubmit="event.preventDefault(); window.location.href='index.html';">
                    <div class="auth-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to access your collection.</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required minlength="8">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                </form>

                
                <form id="signup-form" class="form-content" onsubmit="event.preventDefault(); window.location.href='index.html';">
                    <div class="auth-header">
                        <h2>Join the Club</h2>
                        <p>Create an account to track your orders.</p>
                    </div>

                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required pattern="[A-Za-z\s]+">
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" class="form-control" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password (Min 8 chars)</label>
                        <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
                        <small style="color:var(--text-secondary);font-size:0.75rem;margin-top:0.3rem;display:block;">Must contain uppercase, lowercase & numbers.</small>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Register Account</button>
                </form>
            </div>
        </div>

    </section>

</body>
</html>
