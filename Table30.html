<!DOCTYPE html>
<html>
<head>
<style>
  /* Basic styling to make the table readable */
  table {
    font-family: Arial, sans-serif;
    border-collapse: collapse;
    width: 100%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 12px;
  }

  /* Adds a "zebra stripe" effect to rows */
  tr:nth-child(even) {
    background-color: #f9f9f9;
  }

  /* Style the header row */
  th {
    background-color: #007bff;
    color: white;
  }
</style>
</head>
<body>

<h2>Project Management Overview</h2>

<table>
  <thead>
    <tr>
      <th>Task Name</th>
      <th>Assigned To</th>

    </tr>
  </thead>

    </tr>
    <tr>

  </tbody>
</table>

</body>
</html>
