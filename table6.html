<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; /* Prevents double borders */
            margin: 25px 0;
            font-size: 18px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
            padding: 12px 15px;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
      
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
            cursor: default;
        }
    </style>
</head>
<body>

    <h2>Project Status Board</h2>

    <table>
        <thead>
            <tr>
                <th>Project Name</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Budget</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Website Redesign</td>
                <td>Oct 15, 2023</td>
                <td>In Progress</td>
                <td>$5,000</td>
            </tr>
            <tr>
                <td>Mobile App</td>
                <td>Dec 01, 2023</td>
                <td>Planning</td>
                <td>$12,000</td>
            </tr>
            <tr>
                <td>SEO Audit</td>
                <td>Sept 20, 2023</td>
                <td>Completed</td>
                <td>$1,500</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"><strong>Total Allocated</strong></td>
                <td><strong>$18,500</strong></td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
