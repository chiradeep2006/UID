<!DOCTYPE html>
<html>
<head>
<style>
  /* Basic styling to make the table readable */
  table {
    font-family: Arial, sans-serif;
    border-collapse: collapse;
    width: 100%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
  }

  /* Adds a "zebra stripe" effect to rows */
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  /* Style the header row */
  th {
    background-color: #4CAF50;
    color: white;
  }
</style>
</head>
<body>

<h2>Project Status Table</h2>

<table>
  <thead>
    <tr>
      <th>Project Name</th>
      <th>Lead Developer</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Phoenix Alpha</td>
      <td>Jane Doe</td>
      <td>In Progress</td>
    </tr>
    <tr>
      <td>Quantum Sync</td>
      <td>John Smith</td>
      <td>Completed</td>
    </tr>
    <tr>
      <td>Terraform Bot</td>
      <td>Alex Rivera</td>
      <td>On Hold</td>
    </tr>
  </tbody>
</table>

</body>
</html>
