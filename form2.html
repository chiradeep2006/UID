<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox | Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1450&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Arial', sans-serif;
        }

        .login-card {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .brand-logo {
            color: #e50914; /* Netflix Red */
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            display: block;
            text-decoration: none;
        }

        .form-control {
            background: #333;
            border: none;
            color: white;
            padding: 12px;
        }

        .form-control:focus {
            background: #454545;
            color: white;
            box-shadow: none;
            border: 1px solid #e50914;
        }

        .btn-login {
            background: #e50914;
            border: none;
            padding: 12px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #b20710;
        }

        .error-text {
            color: #e87c03;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card" data-aos="zoom-in" data-aos-duration="800">
        <a href="#" class="brand-logo">MOVIEBOX</a>
        <h2 class="mb-4">Sign In</h2>
        
        <form id="loginForm">
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Email or phone number">
                <div id="emailError" class="error-text">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="Password">
                <div id="passwordError" class="error-text">Your password must contain between 4 and 60 characters.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login">Sign In</button>
            
            <div class="d-flex justify-content-between mt-3 text-secondary small">
                <div><input type="checkbox"> Remember me</div>
                <a href="#" class="text-secondary text-decoration-none">Need help?</a>
            </div>
        </form>

        <div class="mt-5 text-secondary">
            New to MovieBox? <a href="#" class="text-white text-decoration-none">Sign up now.</a>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        // 4. Form Validation Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            
            let isValid = true;

            // Email Regex Validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email.value)) {
                emailError.style.display = 'block';
                email.style.borderBottom = '2px solid #e87c03';
                isValid = false;
            } else {
                emailError.style.display = 'none';
                email.style.borderBottom = 'none';
            }

            // Password Length Validation
            if (password.value.length < 4 || password.value.length > 60) {
                passwordError.style.display = 'block';
                password.style.borderBottom = '2px solid #e87c03';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
                password.style.borderBottom = 'none';
            }

            if (isValid) {
                alert("Login Successful! Point #4 (Validation) Requirement Met.");
                // Here you would typically redirect to the homepage
            }
        });
    </script>
</body>
</html>
