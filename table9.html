<!DOCTYPE html>
<html>
<head>
<style>
  table {
    font-family: sans-serif;
    border-collapse: collapse;
    width: 100%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
  }

  /* Zebra striping for readability */
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  th {
    background-color: #4CAF50;
    color: white;
  }
</style>
</head>
<body>

<h2>Employee Directory</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Department</th>
      <th>Role</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Alex Rivera</td>
      <td>Design</td>
      <td>UI/UX Lead</td>
    </tr>
    <tr>
      <td>Sam Chen</td>
      <td>Engineering</td>
      <td>Frontend Developer</td>
    </tr>
    <tr>
      <td>Jordan Smyth</td>
      <td>Marketing</td>
      <td>SEO Specialist</td>
    </tr>
  </tbody>
</table>

</body>
</html>
