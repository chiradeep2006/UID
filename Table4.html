<!DOCTYPE html>
<html>
<head>
    <title>Academic Course Table</title>
    <style>
      
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }
     
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 12px;
        }
               th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>
        <caption>Semester 1 Course List</caption>
        <thead>
            <tr>
                <th>Course Code</th>
                <th>Course Name</th>
                <th>Credits</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>123MA8748T</td>
                <td>Discrete Mathematics</td>
                <td>4</td>
            </tr>
            <tr>
                <td>788CSE878</td>
                <td>Java Programming</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
