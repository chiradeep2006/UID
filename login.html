<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Chira's Turf</title>
    <meta name="description" content="Sign in or register to book pitches or buy a membership at Chira's Turf.">
    <link rel="stylesheet" href="style.css">
    <style>
        
        .navbar .nav-links a.active { color: var(--text-primary); border: none; }
        .navbar .nav-links a.active::after { width: 0; }
        .navbar .nav-links a[href="login.html"] { color: var(--accent-primary); }
        .navbar .nav-links a[href="login.html"]::after { width: 100%; }
    </style>
</head>
<body>

    
    <nav class="navbar">
        <div class="container flex items-center justify-between">
            <div class="nav-left">
                <a href="login.html" class="btn">Logout</a>
                <a href="index.html" class="brand-logo">CHIRA'S <span>TURF</span></a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="membership.html">Membership</a></li>
                <li><a href="login.html" class="active">Sign In</a></li>
            </ul>
        </div>
    </nav>

    
    <section class="auth-container">
        <div class="auth-wrapper">
            
            
            <input type="radio" id="tab-login" name="auth-tab" class="form-toggle-input" checked>
            <input type="radio" id="tab-signup" name="auth-tab" class="form-toggle-input">

            <div class="form-labels">
                <label for="tab-login">Sign In</label>
                <label for="tab-signup">Register</label>
            </div>

            <div class="forms-box">
                
                <form id="login-form" class="form-content" onsubmit="event.preventDefault(); window.location.href='index.html';">
                    <div class="auth-header">
                        <h2>Welcome <span>Back</span></h2>
                        <p style="color:var(--text-secondary);">Sign in to book a pitch.</p>
                    </div>
                    
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-control" placeholder="athlete@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required minlength="8">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
                    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                        Green borders indicate valid input. Red is invalid.
                    </p>
                </form>

               
                <form id="signup-form" class="form-content" onsubmit="event.preventDefault(); window.location.href='index.html';">
                    <div class="auth-header">
                        <h2>Join the <span>Squad</span></h2>
                        <p style="color:var(--text-secondary);">Create an account for turf deals.</p>
                    </div>

                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" class="form-control" placeholder="e.g. Cristiano Ronaldo" required pattern="[A-Za-z\s]{3,}">
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" class="form-control" placeholder="athlete@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Secure Password (Min 8 chars)</label>
                        <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
                        <small style="color:var(--text-secondary);font-size:0.8rem;display:block;margin-top:0.3rem;">Must contain uppercase, lowercase & a number.</small>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register Account</button>
                </form>
            </div>
            
        </div>
    </section>

</body>
</html>
