<!DOCTYPE html>
<html>
<head>
<style>
  table {
    font-family: Arial, sans-serif;
    border-collapse: collapse;
    width: 100%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
  }

  tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  th {
    background-color: #4CAF50;
    color: white;
  }
</style>
</head>
<body>

<h2>Project Status Table</h2>

<table>
  <thead>
    <tr>
      <th>Project Name</th>
      <th>Lead Developer</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Alpha Centauri</td>
      <td>Jane Doe</td>
      <td>Completed</td>
    </tr>
    <tr>
      <td>Project Bluebook</td>
      <td>John Smith</td>
      <td>In Progress</td>
    </tr>
    <tr>
      <td>Nebula Initiative</td>
      <td>Alex Vance</td>
      <td>Planning</td>
    </tr>
  </tbody>
</table>

</body>
</html>
