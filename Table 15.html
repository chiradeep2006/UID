<!DOCTYPE html>
<html>
<head>
<style>
  table {
    font-family: sans-serif;
    border-collapse: collapse;
    width: 100%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 12px;
  }

  /* Adds a zebra-stripe effect for readability */
  tr:nth-child(even) {
    background-color: #f9f9f9;
  }

  th {
    background-color: #4CAF50;
    color: white;
  }
</style>
</head>
<body>

<h2>Project Team Directory</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Location</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Alex Rivera</td>
      <td>Lead Designer</td>
      <td>New York</td>
    </tr>
    <tr>
      <td>Sam Chen</td>
      <td>Developer</td>
      <td>San Francisco</td>
    </tr>
    <tr>
      <td>Jordan Smyth</td>
      <td>Project Manager</td>
      <td>London</td>
    </tr>
  </tbody>
</table>

</body>
</html>
