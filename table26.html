<!DOCTYPE html>
<html>
<head>
<style>
  table {
    font-family: Arial, sans-serif;
    border-collapse: collapse;
    width: 100%;
  }

  td, th {
    border: 1px solid #dddddd;
    text-align: left;
    padding: 8px;
  }

  tr:nth-child(even) {
    background-color: #f2f2f2;
  }
  
  th {
    background-color: #4CAF50;
    color: white;
  }
</style>
</head>
<body>

  </tr>

  </tr>
  <tr>
    <td>Sam Smith</td>

    <td>London</td>
  </tr>
  <tr>
    <td>Jordan Lee</td>

</body>
</html>
