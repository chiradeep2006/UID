<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional HTML Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse; /* Prevents double borders */
            font-family: Arial, sans-serif;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
            color: #333;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f1f1; /* Highlights row on hover */
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>#101</td>
                <td>Mechanical Keyboard</td>
                <td>Peripherals</td>
                <td>$89.00</td>
            </tr>
            <tr>
                <td>#102</td>
                <td>Ultrawide Monitor</td>
                <td>Displays</td>
                <td>$350.00</td>
            </tr>
            <tr>
                <td>#103</td>
                <td>Ergonomic Mouse</td>
                <td>Peripherals</td>
                <td>$45.00</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
